<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro - Encanto do pão</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f8f5f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff8f0;
      border-radius: 20px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
      padding: 30px;
      width: 400px;
    }
    .container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #5d3a00;
    }
    .form-group {
      margin-bottom: 15px;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #5d3a00;
    }
    input {
      width: 100%;
      padding: 10px 40px 10px 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #b67b2e;
      box-shadow: 0 0 5px rgba(182, 123, 46, 0.5);
    }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 65%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .password-toggle img {
      width: 22px;
      height: 22px;
      filter: invert(40%);
      transition: 0.2s;
    }
    .password-toggle:hover img {
      filter: invert(25%) sepia(80%) saturate(500%) hue-rotate(20deg);
    }
    .btn {
      width: 32%;
      padding: 10px;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-cadastrar {
      background: #b67b2e;
    }
    .btn-cadastrar:hover {
      background: #8a5e21;
    }
    .btn-limpar {
      background: #c94f4f;
    }
    .btn-limpar:hover {
      background: #a33b3b;
    }
    .btn-cancelar {
      background: #666;
    }
    .btn-cancelar:hover {
      background: #444;
    }
    .botoes {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }
    .error {
      color: red;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Cadastro de Perfil</h2>

    <form id="cadastroForm" method="POST" action="processar_cadastro.php">
      <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required />
        <span class="error" id="nomeErro">Digite um nome válido.</span>
      </div>

      <div class="form-group">
        <label for="sobrenome">Sobrenome:</label>
        <input type="text" id="sobrenome" name="sobrenome" required />
        <span class="error" id="sobrenomeErro">Digite um sobrenome válido.</span>
      </div>

      <div class="form-group">
        <label for="cpf">CPF:</label>
        <input
          type="text"
          id="cpf"
          name="cpf"
          placeholder="000.000.000-00"
          maxlength="14"
          required
        />
        <span class="error" id="cpfErro">CPF inválido.</span>
      </div>

      <div class="form-group">
        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required />
      </div>

      <div class="form-group">
        <label for="telefone">Telefone:</label>
        <input
          type="text"
          id="telefone"
          name="telefone"
          placeholder="(99) 99999-9999"
          maxlength="15"
          required
        />
        <span class="error" id="telefoneErro">Telefone inválido.</span>
      </div>

      <div class="form-group">
        <label for="telefoneExtra">Telefone Extra:</label>
        <input
          type="text"
          id="telefoneExtra"
          name="telefoneExtra"
          placeholder="(99) 99999-9999"
          maxlength="15"
        />
        <span class="error" id="telefoneExtraErro">Telefone extra inválido.</span>
      </div>

      <div class="form-group">
        <label for="endereco">Endereço:</label>
        <input
          type="text"
          id="endereco"
          name="endereco"
          placeholder="Cidade, Bairro, Rua"
          required
        />
      </div>

      <div class="form-group">
        <label for="numero">Logradouro:</label>
        <input type="text" id="numero" name="numero" placeholder="Número da casa" required />
      </div>

      <div class="form-group">
        <label for="complemento">Complemento:</label>
        <input type="text" id="complemento" name="complemento" placeholder="Apartamento, bloco, etc." />
      </div>

      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required />
        <span class="error" id="emailErro">Digite um e-mail válido.</span>
      </div>

      <div class="form-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required />
        <button
          type="button"
          class="password-toggle"
          id="toggleSenha"
          title="Mostrar senha"
        >
          <img
            src="https://img.icons8.com/ios-filled/24/000000/visible.png"
            alt="Mostrar senha"
          />
        </button>
        <span class="error" id="senhaErro">A senha deve ter no mínimo 6 caracteres.</span>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar Senha:</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" required />
        <button
          type="button"
          class="password-toggle"
          id="toggleConfirmar"
          title="Mostrar senha"
        >
          <img
            src="https://img.icons8.com/ios-filled/24/000000/visible.png"
            alt="Mostrar senha"
          />
        </button>
        <span class="error" id="confirmarErro">As senhas não coincidem.</span>
      </div>

      <div class="botoes">
        <button type="submit" class="btn btn-cadastrar">Cadastrar</button>
        <button type="reset" class="btn btn-limpar">Limpar</button>
        <button type="button" class="btn btn-cancelar" id="cancelarBtn">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById("cadastroForm");
    const cancelarBtn = document.getElementById("cancelarBtn");
    const toggleSenha = document.getElementById("toggleSenha");
    const toggleConfirmar = document.getElementById("toggleConfirmar");
    const senhaInput = document.getElementById("senha");
    const confirmarInput = document.getElementById("confirmarSenha");

    const eyeOpen = "https://img.icons8.com/ios-filled/24/000000/visible.png";
    const eyeClosed = "https://img.icons8.com/ios-filled/24/000000/closed-eye.png";

    toggleSenha.addEventListener("click", () => {
      const type = senhaInput.getAttribute("type") === "password" ? "text" : "password";
      senhaInput.setAttribute("type", type);

      toggleSenha.querySelector("img").src = type === "password" ? eyeOpen : eyeClosed;
      toggleSenha.title = type === "password" ? "Mostrar senha" : "Ocultar senha";
    });

    toggleConfirmar.addEventListener("click", () => {
      const type = confirmarInput.getAttribute("type") === "password" ? "text" : "password";
      confirmarInput.setAttribute("type", type);

      toggleConfirmar.querySelector("img").src = type === "password" ? eyeOpen : eyeClosed;
      toggleConfirmar.title = type === "password" ? "Mostrar senha" : "Ocultar senha";
    });

    cancelarBtn.addEventListener("click", () => {
      alert("Cadastro cancelado! Você voltou pra página inicial");
      window.location.href = "Home.html"; // Ajuste para sua página inicial
    });

    // Máscara para CPF: 000.000.000-00
    function mascaraCPF(value) {
      return value
        .replace(/\D/g, "")
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    }

    // Máscara para telefone
    function mascaraTelefone(value) {
      value = value.replace(/\D/g, "");
      if (value.length > 11) value = value.slice(0, 11);
      if (value.length > 10) {
        return value.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
      } else {
        return value.replace(/^(\d{2})(\d{4})(\d{0,4})$/, "($1) $2-$3").replace(/-$/, "");
      }
    }

    // Validação CPF
    function validarCPF(cpf) {
      cpf = cpf.replace(/\D/g, "");
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;

      let soma = 0;
      for (let i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
      let resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.charAt(9))) return false;

      soma = 0;
      for (let i = 0; i < 10; i++) soma += parseInt(cpf.charAt(i)) * (11 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.charAt(10))) return false;

      return true;
    }

    const telRegex = /^\(\d{2}\) \d{4,5}-\d{4}$/;

    // Aplicar máscaras enquanto digita
    document.getElementById("cpf").addEventListener("input", e => {
      e.target.value = mascaraCPF(e.target.value);
    });
    document.getElementById("telefone").addEventListener("input", e => {
      e.target.value = mascaraTelefone(e.target.value);
    });
    document.getElementById("telefoneExtra").addEventListener("input", e => {
      e.target.value = mascaraTelefone(e.target.value);
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      let valido = true;

      const nomeRegex = /^[A-Za-zÀ-ÖØ-öø-ÿ ]{3,}$/;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      const nome = document.getElementById("nome");
      const sobrenome = document.getElementById("sobrenome");
      const cpf = document.getElementById("cpf");
      const telefone = document.getElementById("telefone");
      const telefoneExtra = document.getElementById("telefoneExtra");
      const email = document.getElementById("email");
      const senha = document.getElementById("senha");
      const confirmarSenha = document.getElementById("confirmarSenha");
      const numero = document.getElementById("numero");
      const endereco = document.getElementById("endereco");
      const complemento = document.getElementById("complemento");
      const nascimento = document.getElementById("nascimento");

      if (!nomeRegex.test(nome.value)) {
        document.getElementById("nomeErro").style.display = "block";
        valido = false;
      } else {
        document.getElementById("nomeErro").style.display = "none";
      }

      if (!nomeRegex.test(sobrenome.value)) {
        document.getElementById("sobrenomeErro").style.display = "block";
        valido = false;
      } else {
        document.getElementById("sobrenomeErro").style.display = "none";
      }

      if (!validarCPF(cpf.value)) {
        document.getElementById("cpfErro").style.display = "block";
        valido = false;
      } else {
        document.getElementById("cpfErro").style.display = "none";
      }

      if (!telRegex.test(telefone.value)) {
        document.getElementById("telefoneErro").style.display = "block";
        valido = false;
      } else {
        document.getElementById("telefoneErro").style.display = "none";
      }

      if (telefoneExtra.value.trim() !== "" && !telRegex.test(telefoneExtra.value)) {
        document.getElementById("telefoneExtraErro").style.display = "block";
        valido = false;
      } else {
        document.getElementById("telefoneExtraErro").style.display = "none";
      }

      if (!emailRegex.test(email.value)) {
        document.getElementById("emailErro").style.display = "block";
        valido = false;
      } else {
        document.getElementById("emailErro").style.display = "none";
      }

      if (senha.value.length < 6) {
        document.getElementById("senhaErro").style.display = "block";
        valido = false;
      } else {
        document.getElementById("senhaErro").style.display = "none";
      }

      if (senha.value !== confirmarSenha.value) {
        document.getElementById("confirmarErro").style.display = "block";
        valido = false;
      } else {
        document.getElementById("confirmarErro").style.display = "none";
      }

      if (numero.value.trim() === "") {
        alert("Por favor, preencha o número da casa.");
        valido = false;
      }

      if (endereco.value.trim() === "") {
        alert("Por favor, preencha o endereço.");
        valido = false;
      }

      if (nascimento.value.trim() === "") {
        alert("Por favor, preencha a data de nascimento.");
        valido = false;
      }

      if (valido) {
        form.submit(); 
      }
    });
  </script>
</body>
</html>
